name: Comprezza CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs for the same branch/PR so queued CI minutes are not
# wasted; the latest commit on a ref is the only run that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Active Play target requirement for the 2026-08-07 release window. The
# deadline step below makes the API 36 transition explicit before submissions
# on or after 2026-08-31.
env:
  PLAY_MIN_TARGET_SDK: '35'
  PLAY_TARGET_TRANSITION_DATE: '2026-08-31'

jobs:
  quality:
    name: Flutter quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Keep in sync with the SDK goldens were generated on; pixel-exact
          # golden comparisons break when the engine version drifts.
          flutter-version: '3.44.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify dependency lockfile
        run: git diff --exit-code -- pubspec.lock

      - name: Generate localization
        run: flutter gen-l10n

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  release:
    name: Signed Android App Bundle
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Must match the quality job so release builds use the same SDK.
          flutter-version: '3.44.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify dependency lockfile
        run: git diff --exit-code -- pubspec.lock

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.0'

      - name: Prepare Android Gradle wrapper
        shell: bash
        run: |
          flutter_sdk="$(cd "$(dirname "$(command -v flutter)")/.." && pwd)"
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          {
            printf 'flutter.sdk=%s\n' "$flutter_sdk"
            printf 'sdk.dir=%s\n' "$android_sdk"
          } > android/local.properties
          gradle -p android wrapper --gradle-version 8.14.0 --distribution-type bin
          test -x android/gradlew

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

      - name: Write signing properties
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$STORE_PASSWORD"
          {
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'storeFile=../upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
          } > android/key.properties

      - name: Assert Play target SDK
        run: |
          target_sdk=$(cd android && ./gradlew -q :app:printTargetSdk | sed -n 's/^COMPREZZA_TARGET_SDK=//p')
          test -n "$target_sdk"
          test "$target_sdk" -ge "$PLAY_MIN_TARGET_SDK"
          if [ "$(date -u +%F)" \> "$PLAY_TARGET_TRANSITION_DATE" ] || [ "$(date -u +%F)" = "$PLAY_TARGET_TRANSITION_DATE" ]; then
            test "$target_sdk" -ge 36
          fi

      - name: Build signed App Bundle
        run: flutter build appbundle --release

      - name: Run Android lint
        working-directory: android
        run: ./gradlew :app:lintRelease

      - name: Generate artifact checksum
        run: sha256sum build/app/outputs/bundle/release/app-release.aab > build/app/outputs/bundle/release/app-release.aab.sha256

      - name: Verify R8 mapping output
        run: test -s build/app/outputs/mapping/release/mapping.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: comprezza-release-aab-${{ github.sha }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/app-release.aab.sha256
            build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties upload-keystore.jks
