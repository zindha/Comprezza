name: Comprezza CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs for the same branch/PR so queued CI minutes are not
# wasted; the latest commit on a ref is the only run that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Flutter quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Keep in sync with the SDK the lockfile and goldens were generated
          # on (dev toolchain is Flutter 3.47.0); pixel-exact golden
          # comparisons break when the engine version drifts.
          flutter-version: '3.47.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify dependency lockfile
        run: git diff --exit-code -- pubspec.lock

      - name: Generate localization
        run: flutter gen-l10n

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  publish-apks:
    name: Build & publish debug/release APKs
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    # Secrets cannot be referenced in step-level `if` conditions directly;
    # expose whether the keystore secret exists through a job-level env var.
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Must match the quality job so APK builds use the same SDK.
          flutter-version: '3.47.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Gradle 8.14 was released as "8.14" (no .0 suffix); 8.14.0 is not a
          # real distribution and setup-gradle rejects it with "Gradle version
          # 8.14.0 does not exist".
          gradle-version: '8.14'

      - name: Prepare Android Gradle wrapper
        shell: bash
        run: |
          flutter_sdk="$(cd "$(dirname "$(command -v flutter)")/.." && pwd)"
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          {
            printf 'flutter.sdk=%s\n' "$flutter_sdk"
            printf 'sdk.dir=%s\n' "$android_sdk"
          } > android/local.properties
          gradle -p android wrapper --gradle-version 8.14 --distribution-type bin
          test -x android/gradlew

      - name: Build debug APK
        run: flutter build apk --debug

      # The release APK needs the upload keystore. Until the release secrets
      # are configured (Settings -> Secrets and variables -> Actions), only the
      # debug APK is published.
      - name: Decode upload keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

      - name: Write signing properties
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$STORE_PASSWORD"
          {
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'storeFile=../upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
          } > android/key.properties

      - name: Build release APK
        if: env.HAS_KEYSTORE == 'true'
        run: flutter build apk --release

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties upload-keystore.jks

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: *//p' pubspec.yaml | tr -d ' \r')"
          short_sha="$(git rev-parse --short HEAD)"
          apks=(build/app/outputs/flutter-apk/app-debug.apk)
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            apks+=(build/app/outputs/flutter-apk/app-release.apk)
          fi
          if [ "${#apks[@]}" -eq 1 ]; then
            notes="Comprezza v${version} (build ${short_sha}). Release APK omitted: signing secrets not configured yet."
          else
            notes="Comprezza v${version} (build ${short_sha})."
          fi
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "${apks[@]}" --title "Latest" --notes "$notes" --latest
