name: comprezza
description: Comprezza — a privacy-first photo compressor and converter by Dzynova Technologies.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  provider: ^6.1.5+1
  go_router: ^17.4.0
  intl: ^0.20.2
  path: ^1.9.1
  image_picker: ^1.2.1
  image_picker_android: ^0.8.12+1
  image_picker_platform_interface: ^2.10.0
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5
  share_plus: ^13.3.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/
